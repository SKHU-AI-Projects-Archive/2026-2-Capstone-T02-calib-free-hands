# GigaHands 실험 ②: 절대 translation 오차 + 양손 상대거리 (focal_length 3-way 비교)
# + 후속검증 A(wrist offset) / B(dz 유의성) / C(130mm대 오차 원인)
# 결과 수치는 여기 없음 — translation_benchmark_report.md 및 각 산출물 CSV/JSON 참고.

experiment_name: translation_and_interhand_benchmark
scripts:   # 전부 hand-demo/gigahands/ 아래
  - eval_translation_gigahands.py          # 3-way 오차 계산 (GT/24mm/파이프라인 기본값)
  - capture_raw_instances_gigahands.py     # raw 값(pred_cam, keypoints_3d[WRIST], bbox 등) 캐시
date_run: "2026-09-16"

data:
  dataset: GigaHands
  location: /public/data/gigahands   # 원본 데이터셋은 프로젝트에 넣지 않고 외부에 둠

sampling:
  reused_from: experiment_pa_mpjpe.yaml   # 동일 함수 재사용, 실행 후 baseline과 교차확인(총 샘플/GT 인스턴스 수 일치)
  seed: 0
  target_per_group: 500
  total_samples: 1500
  gt_hand_instances: 2804
  matched_instances: 1846
  dual_hand_frames: 696

model:
  pipeline: hand-demo (AnyHandPredictor)
  backend: wilor
  checkpoint: anyhand_wilor.ckpt
  wilor_forward_pass_runs: 1   # focal_length 조건 3개(4개, geocalib 포함)를 전부 이 1회 forward pass의
                               # raw 출력(pred_cam, box_center, box_size)에 _cam_crop_to_full 재호출로 계산

focal_conditions:
  gt_focal:
    source: gigahands_optim_params_sample.txt (컬럼 fx, fy)
    definition: (fx + fy) / 2, 카메라별 실측값
    mean_px: 913.8
  hardcoded_24mm:
    definition: 24mm / 36mm(35mm 환산 풀프레임 가정) * 프레임 실제 픽셀 폭
    formula: focal_px = focal_mm / sensor_width_mm * image_width_px
    sensor_width_mm: 36.0
    mean_px: 853.3
  pipeline_default:
    source: models/model_config_wilor.yaml (anyhand 체크포인트 짝)
    definition: EXTRA.FOCAL_LENGTH(1000) / MODEL.IMAGE_SIZE(256) * max(W,H)
    resolution: "1280x720 (표본 전체 동일)"
    value_px: 5000.0

constants:
  WRIST_JOINT_INDEX: 0
  RESCALE_FACTOR: 2.0        # AnyHandPredictor 기본값, bbox 이론치 계산에도 동일하게 적용
  camera_extrinsic_convention: "COLMAP (X_cam = R(qvec) @ X_world + tvec)"

corrections_applied:
  wrist_offset_correction:
    applied: true
    reason: >
      cam_t 만으로는 절대 손목 위치가 아님 — keypoints_3d[WRIST](root-relative)가 정확히
      0이 아니라 손마다 고정 오프셋(~±9.5cm)을 가짐. pred_wrist = cam_t + keypoints_3d[WRIST]
      로 보정(기존 demo_hand_mano.stage3_to_camera_space 규약과 동일).
    validated_in: followup_A (아래 섹션)

outputs:   # 전부 hand-demo/out/gigahands/ 아래
  - eval_translation_gigahands.csv           # 1,846행, GT/24mm/파이프라인기본값/geocalib 컬럼 전부 병합됨
  - eval_interhand_distance_gigahands.csv    # 696행, 동일
  - eval_translation_summary.json
  - gigahands_raw_instances_cache.csv        # 후속분석 A/B/C 공통 원천 데이터
  - translation_benchmark_report.md          # executive summary + 상세 표

# 후속검증 A: wrist offset 고정 상수 검증
followup_A:
  script: (gigahands_raw_instances_cache.csv 재사용, 별도 추론 스크립트 없음)
  method: relative_std_of_norm
  threshold_pct: 5
  threshold_rationale: >
    절대오차가 수십~수백mm 단위(평균 130.9mm)인데 wrist offset 평균(96mm)의 5%는 4.8mm로
    전체 절대오차의 3.7%뿐 — 이 정도 흔들림은 "고정 상수 취급"이 다른 오차원에 묻힌다고
    볼 수 있는 임계선. 계측 CV 5% 미만을 "반복성 우수"로 보는 관례도 참고.
  n_instances: 1846
  output: wrist_offset_validation.md

# 후속검증 B: 양손 dz 차이 통계 검정
followup_B:
  input: eval_interhand_distance_gigahands.csv
  tests: [paired_t_test, wilcoxon_signed_rank, shapiro_wilk(정규성 사전확인)]
  alpha: 0.05
  n_pairs: 696
  output: interhand_dz_significance.md

# 후속검증 C: 130mm대 절대오차 원인 분석
followup_C:
  hypotheses:
    - scale_prediction_bias        # pred_cam 의 s 값 분포, signed z error 1-sample t-test
    - training_data_domain_gap     # FreiHAND/HO-3D 논문 촬영거리 vs GigaHands 실측(카메라 extrinsic)
    - bbox_size_estimation_error   # YOLO box_size vs GT keypoints 투영 기반 이론 box_size
  regression:
    features: [bbox_ratio, gt_cam_distance_mm, pred_cam_s]
    targets: [signed_z_err_gt_mm, abs_error_gt_focal_mm]
  external_sources_checked:
    - arxiv 1909.04349 (FreiHAND)
    - arxiv 1907.01481 / HOnnotate (HO-3D)
    - github.com/chen-si-cs/AnyHand (이번 체크포인트의 학습 데이터 구성)
  output: bias_investigation_report.md
