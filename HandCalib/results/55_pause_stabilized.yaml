note: 실험 54의 비스듬한 책상 영상 12개에서, 손이 멈춘 구간마다 관측 하나를 만들어 교수님 free_template·free_shape3d(od_job
  그대로)에 넣은 실험이다. 멈춘 구간은 손 박스 중심의 움직임으로 검출기와 무관하게 정하고, 구간 안 프레임을 구간 가운데 프레임에 SIFT 호모그래피로
  맞춘 뒤 검출기 관절을 그 좌표로 옮겨 평균했다(정렬 없이 단순 평균한 것은 기록용 변형). 부트스트랩은 구간 단위로 다시 뽑았다. 판정은 실험
  53의 규칙(최소 프레임 수 대신 최소 구간 수)이고 실행 전에 고정했다. 기준 f와의 비교는 summary.md에만 있다.
