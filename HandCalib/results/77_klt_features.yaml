  손 추적은 손 전체(관절 볼록 껍질)의 KLT 모서리로 호모그래피 하나를 이어 붙여 관절을 옮긴다. 그 모서리가 손의 어디(손목 아래 / 손등
  몸통 / 손가락)에 몰리는지, 부위별로 호모그래피에 얼마나 맞는지, 옮긴 관절이 검출 관절에서 얼마나 벗어나는지를 16개 영상 모두 기록하고,
  실험 58의 손등 몸통 추적(손목과 MCP 껍질, 넓힘 없음)으로 옮긴 관절의 f를 74b 추정기로 낸다(경사 11° 고정, 함께 추정 시작 5·12·19°).
  판정 없음.
