note: '실험 54 영상 12개에서 두 가지를 기록용으로 본 진단이다(판정 없음). 종이: 손이 멈춘 프레임(실험 53의 정지 규칙)마다 손 옆
  종이 색으로 종이 영역을 찾고, 윤곽 구간마다 종이-책상 경계를 소수 px로 찾아 보이는 부분으로 네 변의 직선을 맞춘 뒤 교점 4개를 꼭짓점으로
  썼다. 네 변의 잔차가 모두 1 px 이하인 프레임의 꼭짓점만 교수님 free_template에 넣었다(종이가 구겨져 A4 비율은 쓰지 않음).
  손등 몸통: 실험 56의 연속 KLT 체인(설정 그대로)을 손목과 손가락 뿌리 관절(0, 1, 5, 9, 13, 17)의 볼록 영역(넓히지 않음)에만
  돌리고, 기준 프레임 MediaPipe 관절 16점을 옮겨 free_template·free_shape3d(od_job 그대로)에 넣었다. 부트스트랩은
  실험 56과 같다. 기준 f와의 비교는 summary.md에만 있다.'
