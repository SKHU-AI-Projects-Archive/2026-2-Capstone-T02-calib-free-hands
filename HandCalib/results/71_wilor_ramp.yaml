note: 3차원 손 모델(WiLoR, AnyHand 체크포인트; /public/hand-demo의 예측기를 읽기 전용으로 사용)로 프레임마다 손
  메시를 복원해, 메시가 놓이는 면(볼록 껍질에서 손바닥 쪽 면)을 책상으로 보고 관절 위 손등 피부 높이와 관절 중심 높이로 경사를 낸 기록이다(판정
  없음). 영상마다 프레임 중앙값 경사를 실험 67의 책상 제약 추정기(경사 고정)에 넣어 f를 냈다. 종이나 자 없이 영상만으로 경사를 정하는
  방법이다.
