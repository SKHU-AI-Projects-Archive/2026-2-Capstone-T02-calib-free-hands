note: '팀원 영상에서 실험 56의 추적 사슬이 손목을 검출 손목에서 멀리 옮긴다(77: 손 상자의 13.6%, 19.6%; j16 관절은 본인
  영상과 비슷한 1.6~3.1%). 77에서 사슬의 특징점은 65~68%가 손가락에 있었다. 추적을 두 가지로 바꿔 본다: (1) 균형 사슬 -
  특징점을 손 몸통(관절 0·1·5·9·13·17의 껍질)과 손가락에서 같은 수로 뽑는다, (2) 손목 따로 - 손목 주변 원 안의 특징점으로 손목만
  따로 옮긴다. j16에는 손목이 없으므로(손목 빼기는 이미 적용된 상태) 손목의 효과는 j17(j16 + 손목)로 본다. 74b 추정기로 경사
  11° 고정과 함께 추정(시작 5·12·19° 중 비용 최소). 손 사슬 j16은 74b에서 읽는다. 판정 없음.'
