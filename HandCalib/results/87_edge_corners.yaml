note: '실험 56의 추적 사슬은 팀원 영상에서 단계마다 잘 맞으면서도(77) 천천히 미끄러진다(78). 후보: 손가락과 흰 종이의 경계(윤곽)에
  잡힌 특징점은 손이 돌면 피부 위를 미끄러지므로 같은 방향의 치우침을 쌓는다. 본인 새 폰 영상 2개와 팀원 영상 2개에서 (1) 추적 창(21×21)에
  종이가 들어간 특징점(경계 점)의 비율, (2) 멈춤 구간 사이에서 손이 돈 각도와 그 사이 추적 오차(검출 관절과의 거리)의 증가, (3) 경계
  점을 빼고 추적했을 때의 오차와 f(74b 추정기, 경사 11° 고정, 함께 추정 시작 5·12·19° 중 비용 최소, j16)를 본다. 기존
  사슬의 f는 74b에서 읽는다. 판정 없음.'
