  기록이다(판정 없음). 모형: 손은 단단한 평면이고 손가락 끝 쪽이 낮고 손목 쪽이 높게 책상에 대해 기울어 있다(경사). 영상 전체에 책상 자세
  하나, 프레임마다 책상 위 회전각 1개와 이동 2개, f, 손 평면 모양을 함께 푼다. 경사는 0°(손이 책상에 평평), 11° 고정(실험 59),
  f와 함께 추정 세 가지. 시작값은 교수님 free_template 결과에서 얻고, f는 free_template처럼 거친 격자 8점의 프로파일에서
  고른 뒤 다듬는다.'
