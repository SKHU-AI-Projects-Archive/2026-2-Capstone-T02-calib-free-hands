note: '카메라를 책상 면에 대해 약 45°로 두고, 손바닥을 책상에 평평하게 댄 채 옮기고 돌린 영상 하나로 f를 추정한 예비 실험이다. 정면
  구간과 정면 템플릿은 쓰지 않고, 교수님 코드(free_template, free_shape3d, 고치지 않음)에 우리 추적 결과를 얇은 연결
  함수(od_bridge: 선택된 프레임만 free_problem에 넘김)로 넣었다. 프레임 선택(검출, 가장자리, 정지, 손 모양), 블록 부트스트랩,
  판정 규칙은 실행 전에 yaml에 고정했다. 기준 f와의 비교는 summary.md에만 있다.'
