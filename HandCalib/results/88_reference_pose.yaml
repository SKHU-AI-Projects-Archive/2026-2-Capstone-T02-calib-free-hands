note: 87에서 추적 관절과 검출 관절의 거리는 쌓이지 않고, 기준 프레임의 손 자세에서 얼마나 돌았는지에 따라 오르내렸다. 실험 56의 기준
  프레임(검출 프레임의 한가운데)은 본인 영상(0 → + → - → 0)에서는 0° 근처, 팀원 영상(0 → + → -)에서는 한쪽 끝에 걸린다.
  기준 프레임을 각 멈춤 구간의 가운데로 바꿔 실험 56의 추적 사슬(그대로)을 만들고 74b 추정기(경사 11° 고정, 함께 추정 시작 5·12·19°
  중 비용 최소, j16)를 돌린다. 원래 기준의 값은 74b에서 읽는다. 판정 없음.
