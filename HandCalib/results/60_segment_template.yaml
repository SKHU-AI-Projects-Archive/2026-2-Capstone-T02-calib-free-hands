experiment: 60_segment_template
run: runs/60_segment_template/20261103T060948Z
code_commit: 9bc7069
git_dirty_at_run: false
note: 실험 59에서 손 점이 종이에 대해 멈춤 구간마다 약 6 px씩 다르게 놓인 것(손 모양·자세가 구간마다 조금 바뀜)을 보고, 손 모양(평면
  템플릿)을 구간마다 따로 두고 f 하나만 함께 맞췄다. 구간은 손이 멈춘 구간(실험 53의 정지 규칙)의 가운데에서 잘랐고, 사용 프레임 30장
  미만 구간은 이웃 구간에 합쳤다. 교수님 free_template의 부품(procrustes_init, alt_template, cost)을 그대로
  쓰고, 성긴 격자 8점과 포물선 보간으로 시작값을 잡고, f·구간별 템플릿·프레임별 자세를 함께 다듬었다(ba_refine과 같은 모형; 구간
  하나로 같은 절차를 돌린 대조값과 원래 free_template 값을 함께 낸다). 점은 실험 56의 추적점 16점(주)과 MediaPipe 검출
  관절 16점(기록), 프레임은 실험 56 규칙, 부트스트랩은 1초 블록 100번, 판정은 실험 53의 규칙이다. 실행 전에 고정했다. 기준 f와의
  비교는 summary.md에만 있다.
segments_rule:
  pause_gap_frames: 15
  min_pause_frames: 5
  min_segment_frames: 30
