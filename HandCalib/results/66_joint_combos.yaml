note: 손 관절 중 어떤 점들을 써야 f가 잘 나오는지 여러 조합으로 본 실험이다(판정 없음). 1) 실험 65처럼 멈춤 구간 사이에서 관절마다
  '나머지 20점으로 맞춘 호모그래피'에서 벗어나는 양을 재서 덜 변하는 관절 순위를 냈다. 2) 실험 53c 합성 장면에 손바닥은 단단하고 손가락만
  움직이는 변형과 손 경사를 넣어 조합마다 f를 냈다. 3) 실제 영상 12개에서 MediaPipe 관절(부트스트랩 포함)과 실험 56 추적점(기록)으로
  조합마다 교수님 free_template·free_shape3d를 돌렸다. 조합은 실행 전에 고정했고(관절 순위 조합과 무작위 조합은 규칙만 고정),
  조합 고르기는 기준 f를 쓰지 않는 방법(영상 하나 빼고 고르기, 부트스트랩 구간이 가장 좁은 조합, 조합들의 중앙값)으로 하고, 영상마다 정답에
  가장 가까운 조합은 실제로는 쓸 수 없는 참고값으로만 적었다. 기준 f와의 비교는 summary.md에만 있다.
