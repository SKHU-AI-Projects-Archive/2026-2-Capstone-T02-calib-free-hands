note: 실험 54의 비스듬한 책상 영상 12개를 30 fps로 뽑아, 손 영역의 특징점을 이웃 프레임끼리 KLT로 따라가고 프레임 사이 호모그래피를
  기준 프레임(손이 검출된 프레임 중 가운데)에서 앞뒤로 이어 붙였다. 기준 프레임의 MediaPipe 관절을 이어 붙인 호모그래피로 옮긴 점을
  각 프레임의 점으로 써서(검출기는 기준 프레임과 손 영역에만 씀), 추적이 이어지고 화면 가장자리에 닿지 않는 모든 프레임을 교수님 free_template·free_shape3d(od_job
  그대로)에 넣었다. 부트스트랩은 1초 블록, 판정은 실험 53의 규칙이고 실행 전에 고정했다. 기준 f와의 비교는 summary.md에만 있다.
