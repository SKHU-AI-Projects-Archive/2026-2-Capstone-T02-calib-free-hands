note: '실험 58의 규칙(종이 변 맞추기, 잔차 1 px 이하 프레임, 실험 56 추적 설정과 부트스트랩)을 그대로 쓴 기록용 진단이다(판정
  없음). 1) IMG_7350: 종이 꼭짓점으로 free_template의 f·종이 모양·프레임별 종이 자세를 구하고, 손이 종이에 붙어 움직인다고
  보고 손 점마다 종이 기준 3차원 위치를 재투영 최소제곱으로 구했다(종이 호모그래피로 남는 시차를 높이로 푼 것). 높이는 종이 긴 변 대비 %와
  긴 변을 297 mm로 둔 mm로 적었다. 점별 높이 모델·한 평면 모델·종이 평면(높이 0) 모델의 재투영 잔차를 비교했고, 손 점은 실험 56의
  추적점과 MediaPipe 검출 관절 두 가지로 냈다. free_shape3d는 z_rel 0.2와 0.5로 돌렸다. 2) IMG_7352·7355(대조
  7350): 멈춤 구간마다 꼭짓점 번호를 네 가지로 돌려 종이 호모그래피로 손 관절을 기준 구간에 옮겼을 때 가장 잘 겹치는 번호를 찾고, 번호가
  바뀐 구간이 있으면 번호만 고쳐 종이 f를 다시 냈다. 기준 f와의 비교는 summary.md에만 있다.'
