note: 실험 74b에서 경사 함께 추정이 일부 왼손 영상에서 음의 경사로 끝났는데, 그 해의 비용이 같은 영상의 양의 경사 고정 해보다 높았다(IMG_7351
  -35.7° 비용 29.0 대 13° 고정 17.3, IMG_7355 -24.5° 16.8 대 11° 고정 15.3). 즉 데이터가 음의 경사를
  고른 것이 아니라 풀이가 더 나쁜 골짜기에 빠졌다. 여기서는 74b의 경사 고정 해마다(경사, 굴림 0, 책상 자세, f) 거기서 경사와 굴림을
  풀어 준다(hf.dk_free_from_fixed); 풀이는 비용을 낮추기만 하므로 결과는 그 고정 해보다 나쁠 수 없다. 최종값 = 74b의
  함께 추정과 이번 것 중 비용 최소. 점은 실험 56 추적점.
