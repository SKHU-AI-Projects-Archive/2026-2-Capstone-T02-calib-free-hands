note: 실제 영상에서 손이 '평평하고 단단한 판'에서 얼마나 벗어나는지 잰 기록용 실험이다(판정 없음). 멈춤 구간마다 MediaPipe 관절
  16점의 중앙값을 내고, 기준 멈춤 구간에서 각 멈춤 구간으로 가는 가장 잘 맞는 호모그래피를 맞춘 뒤 남는 차이를 쟀다. 평평하고 단단한 손이
  책상 위에서 움직이면 그 차이는 0이므로(f와 무관), 남는 값은 손 모양 변화와 손 경사에 따른 시차, 검출기 오차의 합이다. 같은 측정을 실험
  64의 잡음 없는 합성 장면(경사·변형을 넣은 것)에 해서 환산 기준으로 삼았다. 실험 56의 추적점은 호모그래피로 옮긴 점이라 이 값이 늘 0이어서
  쓰지 않았다.
