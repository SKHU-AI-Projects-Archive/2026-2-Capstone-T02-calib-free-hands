  'free_shape3d', grid, ecfg, sigma2))로 적용해 f를 구하고, 실험 27의 fixed_template 값과 비교한 실험이다.
  프린트 손(실험 34)과 태블릿 화면 영상은 쓰지 않았다. 판정은 실험 41과 같은 규칙(영상별 3차원 f의 거리-f 기울기, 영상 단위 부트스트랩)을
  G6에 적용하고, 규칙과 쓰는 점, 설정은 실행 전에 고정했다. 기준 f와의 비교는 summary.md에만 있다.
