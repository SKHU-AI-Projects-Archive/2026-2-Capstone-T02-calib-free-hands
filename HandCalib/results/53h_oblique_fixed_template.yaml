note: 실험 53e·53f·53g의 비스듬한 책상 영상(IMG_7342, 7344, 7345)에 기존 fixed_template를 적용한 실험이다.
  이 영상에는 화면과 평행한 정면 손이 없어서, 템플릿은 사용자 결정대로 기존 방식(영상 0.5~3초 안에서 가장 덜 움직인 1초 창)으로 만들었다.
  그 손도 약 45° 기울어 찍혀 템플릿이 찌그러져 있으므로 f가 체계적으로 틀릴 수 있다(기준선 비교용). 프레임 선택, 검출기, 관절 집합,
  부트스트랩, 판정 규칙은 실험 53 그대로 실행 전에 고정했다. 기준 f와의 비교는 summary.md에만 있다.
