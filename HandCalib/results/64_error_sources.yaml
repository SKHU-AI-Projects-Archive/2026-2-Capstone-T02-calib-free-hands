  가지 - 손 경사(실험 59), 손 모양의 느린 변형(실험 59·60), 추적 체인의 누적 오차(실험 56) - 를 실제에서 잰 크기 근처로 하나씩,
  그리고 함께 넣어 교수님 free_template(16점)의 f와 기울기가 어떻게 틀어지는지 본 기록용 실험이다. 추적점 조건은 손 표면 점으로
  이웃 프레임 호모그래피를 맞춰 가운데 프레임의 관절을 옮기는 실험 56의 방식을 흉내 냈다. 오차의 크기는 실제 값에 맞췄지만 모양은 단순한 모형이다.
