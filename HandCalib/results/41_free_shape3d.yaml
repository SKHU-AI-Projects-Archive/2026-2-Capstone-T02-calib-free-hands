note: 실험 39·40의 점 추적 결과(같은 코드와 설정)를 교수님이 새로 보내주신 free_shape3d(평면 free_template 위에
  점마다 작은 깊이 변위를 허용하는 3차원 번들 조정)에 넣어 f를 구하고, 실험 40의 free_template·실험 39의 fixed_template과
  비교한 실험이다. 호출은 pb, idx = free_problem(trk, (W, H), ecfg, huber_rel, ids) 와 estimate_run(pb,
  'free_shape3d', grid, ecfg, sigma2) 이고, 실험 39와 같은 사용 표시 8개를 쓴다. 판정은 영상별 3차원 f의 거리-f
  기울기(영상 단위 부트스트랩)로 하고, 판정 규칙과 쓰는 점, 설정은 실행 전에 고정했다. 기준 f와의 비교는 summary.md에만 있다.
