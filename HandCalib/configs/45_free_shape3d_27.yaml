# 45: the supervisor's free_shape3d (experiments 41-43 code) run on the real-hand videos of experiment 27 (the 12 videos IMG_7216-7227, MediaPipe Hand Landmarker joints), as the user asked 2026-10-29: "run it on the 27 videos with
# free_shape3d, excluding the videos of the printed hand (34: IMG_7249-7258) and of the tablet picture (IMG_7289-7294)". Those two sets are not in 27's list. Nothing of 27, 34, 35, 38-43 (code, configs, runs, results) is changed.
# Tracks and exclusion: 27's (candidate mediapipe_hands, wrist removed from every joint set -> the 16 points of estimate_set flat17, 17's phases, tracking conf_min 0.5; exclusion edge rate <= 5 %, hand-detection failure <= 20 %, a valid 1 s front
# window), computed again from the same detections. All present frames (front and tilt phase) enter the problem, as in 40-42.
# Call: pb, idx = free_problem(trk, (W, H), ecfg, huber_rel, ids); r = estimate_run(pb, 'free_shape3d', grid, ecfg, sigma2) (s3_estimate_run; code of handfocal_estimate.py: Levenberg-Marquardt with Schur complement, coarse 8-point f grid, z_rel 0.2,
# alt_iters 3, max_frames 120 = the supervisor's defaults); ecfg = pipeline.estimate of 27, f grid 60 points 0.35-1.6 x the long side (the coarse grid is a subsample of it).
# Verdict (41's rule, fixed before the run) on G6 (right hand, 50 / 60 / 75 cm): slope of log f on log distance from the geometric mean of the per-video 3-D f of each distance, video-level bootstrap (n 1000, seed 42), pr_verdict thresholds unchanged
# (none: interval above -0.3 and every distance's f within +-10 % of the reference f; yes: interval below -0.7; else hold; a distance without a video, a 3-D f on a bound of the grid range, or a planar grid minimum on the grid edge gives 판단 불가).
# G7 (left hand, 60 cm) is reported beside it and is not part of the verdict. The planar pooled-curve calculation (as in 40-42) is reported too. Compared with 27's fixed_template f of the same videos (read from 27's run folder in the main checkout).
# The reference f is the 35c checkerboard value of the same camera and lens (not re-measured); it appears only in summary.md. Nothing here was tuned on these videos. Code: branch exp/45-free-shape3d-27; code commit in code_45 below (set after the code commit).
experiment:
  name: 45_free_shape3d_27
  seed: 42

# 27: the 25 / 26 method (mediapipe_hands + wrist_mode exclude + fixed_template, about 20 s videos) on the 1x main camera in two more conditions: G6 hand-camera distance (50 / 60 / 75 cm, right hand),
# G7 left hand. All videos: 1x lens, same session, ref_f 1680. Every threshold below is fixed 2026-10-26 before any new video is processed; nothing is changed after seeing results.
videos:                              # entries: {file, group, distance_cm, hand, ref_f}; shooting order = IMG number (distance 50 -> 60 -> 75 three times, then the left hand)
  - {file: IMG_7216.MOV, group: G6, distance_cm: 50, hand: right, ref_f: 1680}
  - {file: IMG_7217.MOV, group: G6, distance_cm: 60, hand: right, ref_f: 1680}
  - {file: IMG_7218.MOV, group: G6, distance_cm: 75, hand: right, ref_f: 1680}
  - {file: IMG_7219.MOV, group: G6, distance_cm: 50, hand: right, ref_f: 1680}
  - {file: IMG_7220.MOV, group: G6, distance_cm: 60, hand: right, ref_f: 1680}
  - {file: IMG_7221.MOV, group: G6, distance_cm: 75, hand: right, ref_f: 1680}
  - {file: IMG_7222.MOV, group: G6, distance_cm: 50, hand: right, ref_f: 1680}
  - {file: IMG_7223.MOV, group: G6, distance_cm: 60, hand: right, ref_f: 1680}
  - {file: IMG_7224.MOV, group: G6, distance_cm: 75, hand: right, ref_f: 1680}
  - {file: IMG_7225.MOV, group: G7, distance_cm: 60, hand: left, ref_f: 1680}
  - {file: IMG_7226.MOV, group: G7, distance_cm: 60, hand: left, ref_f: 1680}
  - {file: IMG_7227.MOV, group: G7, distance_cm: 60, hand: left, ref_f: 1680}
input_dir: /home/juson/data/hand_focal_videos
session:                             # what the entries do not say: 1x main camera, no gloves; the person is not named
  phone: main
  lens: 1x
  glove: false
  person_id:
notes:
  G7: 왼손 촬영이 오른손보다 어색했다고 함

candidate:                           # fixed (22 / 25 / 26); not changed here
  detector: mediapipe_hands
  wrist_mode: exclude
  estimator: fixed_template
  front_window: 17's (phase_mode nominal, tilt phase from 3.0 s)
exclusion:                           # same as 26 (shooting conditions only)
  edge_rate_max: 0.05                # share of detected frames whose hand box touches the image border
  detect_fail_max: 0.20              # share of frames without a detected hand

# Rating v2 of every video (replaces the sharpness): '사용 가능' = tilt >= tilt_min_s, largest theta2d >= theta_max_min_deg and bootstrap log SD <= usable_log_std_max;
# '참고' = both shooting conditions hold and the log SD <= reference_log_std_max (read as: the two shooting conditions hold, only the log SD is looser); '사용 불가' = otherwise.
rating_v2:
  tilt_min_s: 18.0
  theta_max_min_deg: 55.0
  usable_log_std_max: 0.10
  reference_log_std_max: 0.15
# Verification of v2 on the new videos: among the usable videos the share with |log(f / ref_f)| <= within_sigma * log SD must be >= within_share_min and their median |error| <= median_abs_err_max.
verification_v2:
  within_sigma: 2.0
  within_share_min: 0.9
  median_abs_err_max: 0.10
  min_usable: 5                      # fewer usable videos: not judged

# G6 verdict (distance): pooled f per distance (cost curves summed, video-level bootstrap interval); pass = every distance's pooled f within +-pooled_tol of ref_f and max / min of the pooled f <= ratio_max;
# fail = otherwise; not judged when a distance has fewer than min_videos_per_distance included videos.
distance:
  pooled_tol: 0.10
  ratio_max: 1.15
  min_videos_per_distance: 2
  bootstrap_n: 1000
  bootstrap_seed: 42
# G7 verdict (left hand) = 26's group verdict: pooled f within +-pooled_tol of ref_f and at least video_fraction of the videos within +-video_tol.
generalization:
  pooled_tol: 0.10
  video_tol: 0.15
  video_fraction: 0.6666666666666666
  min_videos: 3                      # a group with fewer videos is not judged
  bootstrap_n: 1000
  bootstrap_seed: 42
hand_compare:                        # record only: G7 beside the G6 right-hand videos of this distance (same session)
  right_distance_cm: 60

# Guide v2 = 21's guide with the hand box limit 0.65 (21: 0.6)
guide:
  phase_segmentation:
    noise_percentile: 95
    k_d: 3.0
    theta_min_deg: 15.0
    median_window_s: 0.3
    sustain_s: 0.5
    front_search_s:
    - 0.5
    - 2.5
    d0_cap_theta_deg: 20.0
    use_motion: false
    k_v: 3.0
    motion_window_s: 0.3
    exclude_large_tilt: false
    max_tilt_deg: 45.0
  conditions:
    reference_detector: wilor_yolo
    box_short_ratio_max: 0.65
    edge_rate_max: 0.05
    transition_min_s: 2.5
    tilt_rule: frames_median
    tilt_max_deg: 45.0
    min_tilt_frames: 30
    theta_tilt_median_range_deg:
    - 20.0
    - 40.0
    axis_bins_min: 5
    finger_extension_min: 0.9

# Existing results, read only (never detected again): the descriptive comparison and the 22 / 25 videos rated with rule v2 after the fact (not a verification)
