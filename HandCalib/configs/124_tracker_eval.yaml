# 124: 추적 변형을 마커로 채점 (사용자 2026-11-11: "평면 변환이 틀려서 생기는 문제면 평면 변환이 맞도록 고치면 되는거 아니야?"), 기록용, 판정 없음.
# 123: 팀원 손의 f 오차는 광류 사슬의 평면 변환이 틀려서 생긴다(같은 마커를 가장 잘 맞는 평면 변환으로 옮기면 +8%, 사슬로 옮기면 -15%; '+' 쪽에서 손 폭 -18 ~ -21%).
# 이미 있는 사슬 변형을 같은 마커 영상 4개에서 돌려, 그 평면 변환이 마커와 얼마나 맞는지 본다(마커는 채점에만 쓰고 추적에는 쓰지 않음):
#   chain = 지금 사슬(kt_chain), balanced = 특징점을 손 몸통(관절 0·1·5·9·13·17 의 껍질)과 손가락에서 반씩(83 의 bc_chain), dorsum = 손 몸통에서만(91 의 dc_chain),
#   dorsum_clahe / hand_clahe = 특징점을 고를 때 대비 보정(91 과 같은 값). 기준 프레임은 122 와 같은 첫 정지 구간(91 은 한가운데 프레임이었음).
# 변형마다: 평면 변환이 틀린 부분의 크기, 손 폭·길이의 치우침(손 방향 구간별), 그 변환으로 옮긴 마커의 f, 그 변환으로 옮긴 MediaPipe 기준 관절의 f(마커 없이 쓰는 실제 추적점).
# 읽는 법(실행 전에 정함): 팀원 영상에서 '+' 쪽 손 폭 치우침이 뚜렷이 줄고 옮긴 마커의 f 가 가장 잘 맞는 평면 변환의 값(+8%)에 가까워지며 내 영상이 나빠지지 않는 변형이 있으면, 그 변형을 마커 없는 영상에서 시험할 후보.
# 기준 f 는 summary.md 에만.
experiment:
  name: 124_tracker_eval
  seed: 42
settings_config: configs/74b_multistart_rerun.yaml
joint_set: j16
code: {branch: optical_flow, commit: d41b293, modules: [HandCalib/optical_flow/experiments.py]}
ramps_deg: [11]
reference: {mode: first_pause, pause_gap_frames: 15, min_pause_frames: 5}
videos: ["__none__"]
extra_videos:
  - {file: IMG_7399.MOV, person: teammate, ref_f_px: 1672}
  - {file: IMG_7400.MOV, person: teammate, ref_f_px: 1672}
  - {file: IMG_7405.MOV, person: self, ref_f_px: 1672}
  - {file: IMG_7406.MOV, person: self, ref_f_px: 1672}
detection_cache_from: runs/122_marker_track_both/20261111T092735Z/detection_cache
tracker_eval:
  points_run: runs/122_marker_track_both/20261111T092735Z
  angle_bins_deg: [-180, -60, -20, 20, 60, 180]
  clahe: {clip: 2.0, tile: 8}
  variants:
    chain: {kind: chain}
    balanced: {kind: balanced, body_joints: [0, 1, 5, 9, 13, 17]}
    dorsum: {kind: dc, mask: dorsum, clahe: false}
    dorsum_clahe: {kind: dc, mask: dorsum, clahe: true}
    hand_clahe: {kind: dc, mask: hand, clahe: true}
workers: 50
video_workers: 4
output:
  root: runs/124_tracker_eval
  results_yaml: results/124_tracker_eval.yaml
