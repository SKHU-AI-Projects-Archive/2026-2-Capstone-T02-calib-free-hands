# 96: 영상 구도 그대로의 합성 장면 (사용자 2026-11-10: "일단 진행은 해보는데" - 팀원 오차가 촬영 구도·동작(A) 탓인지 실제 점(B) 탓인지 가르기), 기록용, 판정 없음.
# 94(첫 정지 구간 기준) 의 추적점을 같은 설정으로 다시 만들고, 책상 운동 모델을 94 의 f(경사 11° 고정, j16)에서 맞춘다(dk_solve, f 고정). 그 해의 카메라 기울기, 손 템플릿, 프레임별 회전·미끄러짐을
# 그대로 두고 참 f 로 다시 투영한다(카메라-책상 거리만 참 f / 94 f 배, 화면 속 손 크기 유지). 장면: 실제 점 확인용(모델 + 실제 잔차, 94 와 같아야 함), 잡음 없음, 정규 잡음(손 상자 긴 변 x 0.005,
# 시드 3개), 실제 잔차를 얹은 것. 각 장면에 94 와 같은 추정(free_template -> 경사 11° 고정, 함께 추정 시작 5·12·19° 중 비용 최소). 영상 = 새 폰 4개(본인 2, 팀원 2). 검출은 81 캐시 재사용.
# 읽는 법(실행 전에 정함): 팀원 장면의 잡음 없음·정규 잡음에서 참 f 근처(±5%)면 구도·동작 탓이 아님. 실제 잔차를 얹은 장면이 94 처럼 낮으면 실제 점이 모델에서 벗어난 모양이 f 를 민다.
# 기준 f 는 summary.md 에만.
