# 57: 56's continuous tracking on palm videos (user 2026-11-02: "손등 영상 말고 손바닥 영상으로도 실험 진행해줘"; "이전 실험들에서 사용했던 영상들로 진행해줘"). The videos are the 24 of 46 (IMG_7298-7310)
# and 49 (IMG_7312-7323): camera above the desk looking down, the right palm toward the camera (thumb folded), a front window and then the hand tilted (looked at one middle frame of every video; the
# hand is not written in 46 / 49's configs, the frames show the right hand). Reference f 1553 px = the user's value of the 46 / 49 session. Everything of 56 is unchanged: kt_video (30 fps frames,
# KLT on the hand mask, USAC_MAGSAC between neighbours, chained from the middle detected frame), the tracking settings, frames used = every tracked frame off the border, j16 main / j21 record,
# the supervisor's free_template / free_shape3d through od_job, block bootstrap 30 frames x 100 (seed 42), 53's f verdict (min 30 frames; boundary or outside +-25 % -> 어려움; +-10 % with the
# interval within f x (1 +- 0.10) -> 가능성 있음; else 판단 보류). The two warnings of 53 are for a hand on a 45 deg desk (tilt 30-60 deg, turn on the desk) and are not used here; the tilt change
# over the frames (p95 - p5) and the median tilt are recorded instead. 46 / 49's per-video free_shape3d (per-frame MediaPipe j16, front-window rule) is read for comparison.
# Fixed before the run.
