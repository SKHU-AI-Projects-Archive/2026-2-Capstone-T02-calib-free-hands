# 68: sensitivity of 67's desk-motion estimator to the fixed ramp (user 2026-11-04: "민감도 확인을 먼저 해보자", after my proposal: the ramp 7 / 9 / 11 / 13 / 15 deg on the same 12 videos,
# main estimates only, to know how far the ramp may be wrong - not to choose a ramp; 11 deg stays for the new hands), record only, no verdict.
# 67's estimator and points unchanged (estimator_config -> 67's rules_config, segments_config and joint sets; hf.dk_job with the ramp_fixed mode only, one job per ramp).
