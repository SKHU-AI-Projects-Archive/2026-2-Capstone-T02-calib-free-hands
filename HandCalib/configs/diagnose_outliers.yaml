# diagnose_outliers: circle, mix 영상 중 f 절대오차가 20%를 넘는 영상의 원인을 진단하고, 같은 세션·같은 동작의 짝 영상과 비교한다 (사용자 2026-11-23: "circle, mix 영상 중 f 절대오차 20% 초과 영상의 원인을 진단한다. 같은 세션의 같은 동작 짝 영상(예: circle_01 ↔ circle_02)과 비교한다."), 기록용, 판정 없음.
# 실행: python HandCalib/benchmark/diagnose_outliers.py --config HandCalib/configs/diagnose_outliers.yaml  (경로는 --data-root, --results-path, --output-dir 로 덮어쓸 수 있다)
# 상대 경로는 HandCalib/ 기준이다. calibrator.py 와 기존 코드는 고치지 않고, 새 모듈이 Calibrator 를 감싸 estimate() 안쪽 값(호모그래피 원근 항, 선택 프레임)을 꺼낸다.
# 값의 정의는 diagnose_outliers.py 머리말에 있다. 내가 정한 것(결과를 보기 전):
#  - 대상: 기존 결과의 |오차| > abs_error_threshold 인 motions 영상과 그 짝 영상. 오차 = (f - reference_f) / reference_f, 부호도 기록(과대 +, 과소 -).
#  - 같은 영상 결과가 여러 run 에 있으면 이름이 늦은 run 의 행을 쓴다. 영상 하나의 f 를 이 모듈로 다시 계산해 기존 결과와 0.1% 안에서 같은지 모든 채점 영상에서 확인한다(validation.csv).
#  - 부트스트랩은 선택 프레임을 복원추출한다(템플릿과 선택은 그대로). 200회, seed 는 영상 이름과 experiment.seed 로 정한다.
#  - 짝 비교에서 두 값의 상대 차이 |a-b| / max(|a|,|b|) 가 large_difference_ratio 이상이면 크게 다른 항목으로 표시한다.
#  - 기본 제외 세션은 시네마틱 모드로 찍어 가이드 위반인 4k 세션 하나뿐이다.
experiment:
  name: diagnose_outliers
  seed: 42
code: {branch: benchmark, modules: [HandCalib/benchmark/diagnose_outliers.py, HandCalib/benchmark/calibrator.py, HandCalib/benchmark/session_rules.py]}
data_root: /public/data/handcalib_data
results_path: runs/benchmark
output_dir: runs/diagnose_outliers
motions: [circle, mix]
abs_error_threshold: 0.2
pair_mode: same_session
bootstrap_runs: 200
large_difference_ratio: 0.3
exclude_sessions: [s01_20261117_iphoneduo_1x_4k]
diagnostics: {detection: true, tilt: true, tilt_direction: true, hand_shape: true, stability: true, mix_segments: true}
mix_segments: null
