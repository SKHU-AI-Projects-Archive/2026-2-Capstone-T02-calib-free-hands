# 40: the supervisor's free_template (2026-10-29: "add this code and call pb, idx = free_problem(trk, (W, H), ecfg, huber_rel); r = estimate_run(pb, 'free_template', grid, ecfg, sigma2)") run on the same six videos and the same
# marker tracks as experiment 39, to compare with 39's fixed_template. Nothing of 35, 35b, 35c, 38 and 39 (code, configs, runs, results) is changed.
# Tracks: 39's code and settings unchanged (mo_process: whole-frame dots, naming by the stored layout, re-acquisition tracker), so the tracks are 39's (39's precheck passed for all six videos; no new precheck). Used markers: the same
# eight (5, 6, 9, 10, 13, 14, 17, 18), passed as ids to free_problem. ecfg = pipeline.estimate (principal point at the image centre, huber_rel 0.02, f grid 60 points, 0.35-1.6 x the long side), the same as 39.
# Free template: the supervisor's functions as received (procrustes_init, backproject, alt_template, ba_refine, _restrict, free_template, free_problem) with six corrections that stop them from running at all and change nothing of
# the method (least_squares import, np.c -> np.c_, _backproject -> backproject, rodrigues -> _rodrigues, np.r -> np.r_, Problem.new -> Problem.__new__); the supervisor's estimate_run is the new function ft_estimate_run
# (the existing estimate_run is not changed). Defaults of the supervisor's free_template: alt_iters 3, refine true, max_frames 120 (frames subsampled evenly), all present frames (front and tilt) enter the problem.
# Reported per video: f after bundle adjustment (the supervisor's result r['f']), f of the grid minimum (r['f_grid']), whether either sits at a limit, sharpness of the free-template cost curve, and 39's value.
# Verdict: the rules of 39 / 35c unchanged, applied to the pooled free-template cost curves (the grid curves of the videos of a distance summed, video-level bootstrap), as 39 did with fixed_template; a pooled f at the grid edge gives
# 판단 불가. The bundle-adjusted f is reported, not used for the verdict.
# Looked at before the run, for the record: a development run of the supervisor's code on two synthetic videos (planar markers, true f 850 and 1100 px, 960 x 540): bundle-adjusted f 1536 px (the grid upper limit) and 1123 px, grid
# minimum 1447 px and the grid upper limit; about 560 and 1040 s per video. Nothing in this file was tuned on the real videos. The reference f is the 35c value of the same camera and lens, not re-measured for this session.
# The video content is a flat picture on a tablet screen, so no interpretation text of 35 applies.
