# 93: 관절별 따로 추적과 점 영상 (사용자 2026-11-09: "관절별 따로 추적을 어떻게 할것인지 먼저 설명을 하고, 그걸 그려서 영상으로 확인할 수 있게 해줘."), 기록용, f 추정 없음.
# 기존 사슬은 기준 프레임의 관절 21개를 손 전체 특징점의 호모그래피 하나로 옮겨, 그 평면(손가락 평면) 밖의 손목·엄지·손등이 손이 돌수록 어긋난다(87, 90).
# optical_flow.jt_track: 특징점·LK·전후방 검사는 기존과 같고, 관절마다 현재 위치 주변(반지름 = 손 상자 긴 변 x radius_frac) 점이 min_points 개 이상이면 그 점들의 닮음 변환(RANSAC)으로 그 관절만
# 옮긴다; 모자라면 반지름 x widen, 그래도 모자라면 그 단계만 손 전체 호모그래피. 기준 프레임(아래 reference)에서 앞뒤로. 영상: 팀원 2개 + 비교용 본인 1개(7354-복사본).
# 점 영상(왼쪽 전체, 오른쪽 손 확대): 주황 = MediaPipe, 파랑 = 기존 사슬, 초록 = 관절별(속 빈 점 = 손 전체 변환으로 대신). runs/ 에만 저장(커밋 안 함), 메타데이터 제거.
# 기준 프레임(사용자 2026-11-09 지적 뒤 바꿈): 손을 돌리기 전 첫 정지 구간의 가운데(정지 구간 규칙은 실험 60 의 값), 기존 사슬과 관절별 추적 모두 같은 기준.
# 반지름 6% 는 관절 사이 간격(약 10%)보다 작게 고름; 시도한 다른 값 없음. 검출은 81 실행의 캐시 재사용. 실행 전에 정함.
experiment:
  name: 93_joint_track_video
  seed: 42
settings_config: configs/74b_multistart_rerun.yaml
detection_cache_from: runs/81_detected_joints/20261106T055430Z/detection_cache
joint_set: j16
ramps_deg: [11]
videos: ["IMG_7354 - 복사본.MOV", "IMG_7351 - 복사본.MOV", "IMG_7352 - 복사본.MOV"]
joint_track: {radius_frac: 0.06, min_points: 6, widen: 2.0}
reference: {mode: first_pause, pause_gap_frames: 15, min_pause_frames: 5}
render: {font: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc, font_index: 1, left_width: 1280, zoom_size: 720, crop_margin: 1.35}
workers: 8
video_workers: 3
output:
  root: runs/93_joint_track_video
  results_yaml: results/93_joint_track_video.yaml
