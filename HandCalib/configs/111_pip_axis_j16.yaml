# 111: 손 축 뿌리를 PIP(둘째 마디: 6, 10, 14, 18)로 바꾼 책상 운동 추정기, 관절 j16 (사용자 2026-11-10: "남은거 다 해봐.", "PIP가 뭔데, 그걸 기준으로 해"), 기록용, 판정 없음.
# 109·110 은 MCP 를 모두 빼면 손 축(MCP 줄 -> 손가락 끝)을 정할 수 없어 실패했다. 손 축 뿌리만 PIP 줄로 바꾸고(작업 프로세스 안에서 handfocal_report.DK_MCPS 를 바꿈, 파일은 그대로),
# 111 = j16(축만 바꾼 비교 기준), 112 = MCP 4개를 뺀 12개. 점 = 광류 사슬 추적점(99·100 저장, 첫 정지 구간 기준). 추정 = free_template -> 경사 11° 고정.
# 읽는 법(실행 전에 정함): 112 가 111 보다 팀원 영상 오차를 뚜렷이(절댓값 10%p 이상) 줄이고 본인 영상이 크게 나빠지지 않으면 MCP 줄이 원인이라는 근거. 기준 f 는 summary.md 에만.
