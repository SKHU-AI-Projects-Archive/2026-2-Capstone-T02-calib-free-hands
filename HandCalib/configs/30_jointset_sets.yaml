experiment:
  name: 30_jointset_sets
  seed: 42

# 30: the candidate (mediapipe_hands + wrist_mode exclude + fixed_template) is unchanged (f and every other diagnostic are 25-29's). Only the uncertainty joint sets behind the verdict's jointset_range check change.
# Why: with the wrist excluded 17's palm5 (wrist + 4 MCP) is only the 4 nearly collinear MCP points, its f sits on the grid edge and jointset_range <= 0.12 (the ROUGH condition) fails for every video (audit 2026-10-26).
# New sets (no wrist, 8 points each, not collinear): prox8 = MCP + proximal phalanx of the four fingers, index_middle8, ring_pinky8; plus the full set flat17 (16 points without the wrist), as in 17.
# Fixed 2026-10-27 before the run; nothing here is changed after seeing results.
jointset:
  sets:
    prox8: [5, 6, 9, 10, 13, 14, 17, 18]
    index_middle8: [5, 6, 7, 8, 9, 10, 11, 12]
    ring_pinky8: [13, 14, 15, 16, 17, 18, 19, 20]
  uncertainty_sets: [prox8, index_middle8, ring_pinky8, flat17]
# Decision on the replacement: adopted when the new jointset_range is within the ROUGH limit (pipeline.verdict.rough.jointset_range_max, unchanged) for at least min_within_share of the videos AND
# at most max_edge_share of the (video, set) pairs sit on the f grid edge; otherwise the replacement does not help.
decision:
  min_within_share: 0.5
  max_edge_share: 0.10
input_dir: /home/juson/data/hand_focal_videos
detections:                          # content-keyed caches (any run) or, for a video with source17, that 17 run (22's rule: the frame list must equal)
  search_dirs: [runs/*/*/detection_cache]
candidate:
  detector: mediapipe_hands
  wrist_mode: exclude
  estimator: fixed_template
  front_window: 17's (phase_mode nominal, tilt phase from 3.0 s)
videos:                              # every video of 22-29 that the candidate processed: file, lens, ref_f (user-provided checkerboard f: 1x 1680 px, 0.5x 880 px), source17 for the 17 runs of 22 / 23 / 25's baseline
