# 39: experiment 35's question (does f follow the camera distance when the points are markers?) asked of the markers alone, with no hand detector. The same six videos as 38 (IMG_7294 / 7293 at 50 cm, 7292 / 7291 at
# 60 cm, 7290 / 7289 at 75 cm; a hand picture with 21 red dots on a tablet screen, filmed from above, 1x main camera). Reason: 38 followed 35c and needed the MediaPipe hand box, which was missing in the 60 and 75 cm
# videos (box rate 0 % in the tracker), so those four videos were excluded and 38's slope had no value. Nothing of 35, 35b, 35c and 38 (configs, runs, results) is changed.
# What is the same as 35c: the analysis (analyze, fixed_template, nominal front window 0.5-1.5 s, tilt phase from 3 s, block bootstrap), the used markers (5, 6, 9, 10, 13, 14, 17, 18), the re-acquisition tracker
# (mk_track_reacquire, same move_frac / gap_cap / ransac_frac / min_inlier_ratio / min_markers_ratio), the precheck and exclusion share (70 % of the tilt-phase frames), the verdict rules (slope_none_min -0.3, slope_yes_max -0.7,
# f_tol 10 %, video-level bootstrap), the reference f.
# What is new: (1) markers are found in the whole frame by local redness (Lab a*, minus its 31 x 31 median, >= 30), components of area 20-3000 px and roundness >= 0.3, no opening (35c: HSV colour in the enlarged hand box, area 40 px at
# 50 cm); (2) markers are named on the sharpest front-window frame that names every used marker, by a stored layout (configs/39_marker_layout.json: the 20 markers found in the front reference frames of IMG_7294 and
# IMG_7293, named there by the nearest MediaPipe joints in 38, normalised) with a similarity vote (naming: scale 40-400 px per layout unit, rotation within 30 degrees, tolerance 8 % of the scale, at least 12 named);
# (3) the length scale of the tracker and the frame box of the analysis come from the markers: the box of the reference markers enlarged by box_margin 0.1 on every side (the rule of the MediaPipe worker), moved to each
# frame by the homography reference -> frame; (4) a tilt-phase frame is any frame from 3 s (35c: a frame with a hand box); (5) no MediaPipe analysis and no MediaPipe-based comparison.
# Looked at before the precheck, for the record: the first frames of all six videos, the red-component counts of two frames per video (t = 1 s and 8 s) with the 35c colour rule (too few dots at 75 cm: 4 / 1 found at 1 s) and
# with the local-redness rule (21 components in the tablet area in 11 of the 12 frames, 20 in one), from which contrast_min 30, area_min 20 and circularity_min 0.3 were chosen (0.5 dropped real dots with tails); so the detection settings were tuned on these same videos. The reference f is the
# 35c value of the same camera and lens, not re-measured for this session. The video content is a flat picture, so the result says nothing about a real hand's own shape; no interpretation text of 35 applies.
