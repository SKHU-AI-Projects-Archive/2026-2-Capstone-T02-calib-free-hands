# 105: 새로 찍은 영상 4개의 CoTracker3 추적 (사용자 2026-11-10: "확인 순서 제안에서 1번 항목으로 진행해줘."), 기록용, 판정 없음.
# 98 의 CoTracker3 점에서 팀원 영상(2개)이 평평한 단단한 손에서 본인보다 크게 벗어났고(너클·바깥 손가락 끝), 이를 같은 조건의 새 영상(팀원 7384·7387, 본인 7385·7388)에서 확인한다.
# 추적·추정 설정은 98 과 같다(첫 정지 구간 기준, 2 프레임마다, 입력 0.5 배, 보조점 손 영역 격자, j16 경사 11° 고정 + 함께 추정). 추적점은 points/ 에 저장해 106 에서 쓴다.
# 검출은 100 의 캐시 재사용. 기준 f 는 summary.md 에만.
experiment:
  name: 105_cotracker_new_pair
  seed: 42
settings_config: configs/74b_multistart_rerun.yaml
compare_run: runs/100_new_pair_shoot/20261110T032637Z
detection_cache_from: runs/100_new_pair_shoot/20261110T032637Z/detection_cache
joint_set: j16
code: {branch: optical_flow, commit: 67ef907, modules: [HandCalib/optical_flow/cotracker.py, HandCalib/optical_flow/experiments.py]}
ramps_deg: [11]
reference: {mode: first_pause, pause_gap_frames: 15, min_pause_frames: 5}
videos: ["__none__"]
extra_videos:
  - {file: IMG_7384.MOV, person: teammate, ref_f_px: 1672}
  - {file: IMG_7385.MOV, person: self, ref_f_px: 1672}
  - {file: IMG_7387.MOV, person: teammate, ref_f_px: 1672}
  - {file: IMG_7388.MOV, person: self, ref_f_px: 1672}
cotracker:
  hub_dir: ~/.cache/torch/hub/facebookresearch_co-tracker_main
  stride: 2
  scale: 0.5
  support_step_frac: 0.06
  min_visible: 12
  gpu_workers: 4
workers: 64
video_workers: 4
output:
  root: runs/105_cotracker_new_pair
  results_yaml: results/105_cotracker_new_pair.yaml
