# 113: 멈춤 자세마다 손 평면 방향 (97 고침) (사용자 2026-11-10: "남은거 다 해봐."), 기록용, 판정 없음.
# 97 은 호모그래피 분해의 해를 첫 멈춤 법선 일치만으로 골라 카메라 기울기 4~89°처럼 맞지 않는 값이 나왔다. 해 조합을 첫 멈춤 법선과 회전축이 모든 멈춤에서 가장 잘 일치하는 것으로
# 고치고(정답을 아는 장면에서 기울기 45·60°, 경사 11·17° 를 오차 없이 되찾음, 코드 점검), 저장된 점으로 계산한다. 멈춤 = 관절 중심의 프레임 사이 이동 < 손 크기 x 0.004, 간격 15 이하, 5 프레임 이상.
# 점 = 광류 사슬(99·100) 과 CoTracker3(98·105). f = 기준 f 와 그 점의 경사 11° 추정 f(fit_f, 94·100·98·105 결과에서 옮겨 적음).
# 읽는 법(실행 전에 정함): 기준 f 에서 카메라 기울기가 45° 근처이고, 팀원 영상의 손 경사가 멈춤마다 본인보다 뚜렷이 크게 바뀌거나(손이 자세마다 들림) 흩어짐이 크면 모델 가정이 팀원 영상에서 깨진다는 근거. 기준 f 는 summary.md 에만.
