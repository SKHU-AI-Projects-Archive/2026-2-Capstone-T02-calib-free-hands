# 42: experiment 41's free_shape3d (the supervisor's code, 2026-10-29) run on the real-hand marker videos of 35c ("run 41 on other videos too"; the user told me to take the file names and distances from the earlier results):
# IMG_7267 / 7266 (50 cm), 7265 / 7264 (60 cm), 7263 / 7262 (75 cm), hand with red dots on the palm side. Nothing of 35, 35b, 35c, 38, 39, 40, 41 (code, configs, runs, results) is changed.
# Tracks: 35c's code and settings unchanged (mk_process: the stored MediaPipe hand box gives the search region, the naming of the reference frame and the length scale; reacquire tracker; used markers 5, 6, 9, 10, 13, 14, 17, 18;
# exclusion rules of 35c subset mode: tilt-phase valid ratio >= 0.70, edge rate <= 5 %). All six videos passed these rules in 35c, whose tracking is deterministic, so no new precheck is run. All present frames (front and tilt phase) enter the problem, as in 40 and 41.
# Call: pb, idx = free_problem(trk, (W, H), ecfg, huber_rel, ids); r = estimate_run(pb, 'free_shape3d', grid, ecfg, sigma2) (41's s3_estimate_run; ecfg = pipeline.estimate of 35c, f grid 60 points 0.35-1.6 x the long side), with z_rel 0.2,
# alt_iters 3, max_frames 120 (the supervisor's defaults).
# Verdict (41's rule, fixed before the run): slope of log f on log distance from the geometric mean of the per-video 3-D f of each distance, video-level bootstrap (n 1000, seed 42), pr_verdict thresholds unchanged (none: interval above
# -0.3 and every distance's f within +-10 % of the reference f; yes: interval below -0.7; else hold; a distance without a video, a 3-D f on a bound of the grid range, or a planar grid minimum on the grid edge gives 판단 불가). The pooled
# planar-curve calculation is also reported. Compared with 35c's marker analysis (fixed_template, pooled f of 3072 px = the grid edge at 50 cm, i.e. no value) and its MediaPipe(8) analysis, read from the 35c run folder of the main checkout.
# The reference f is the 35c checkerboard value (same camera and lens). Nothing here was tuned on these videos. Code: branch exp/42-free-shape3d-hand-videos; code commit in code_42 below (set after the code commit, before the run).
experiment:
  name: 42_free_shape3d_hand
  seed: 42

# 35c: third configuration of experiment 35 (35_hand_markers.yaml and 35b_hand_markers_subset.yaml stay as they are). The 35b precheck stopped: no 75 cm video passed (15.8 % / 16.2 % of the tilt frames kept); the
# frames were dropped by the homography label check over all matched markers (RANSAC threshold 3 % of the hand box) and the tracker never re-acquired. No f had been computed.
# New rules fixed 2026-10-27 before the new precheck (user's instructions): (1) the homography check uses only the 8 used markers (5, 6, 9, 10, 13, 14, 17, 18), threshold ratio unchanged (3 %);
# (2) re-acquisition: a detection is matched to a marker when it is within the movement limit of the marker's last accepted position OR of its predicted position (reference position moved by the homography of the last
# accepted frame); the limit is move_frac x hand box x min(frames since the last accepted frame, gap_cap), applied around both; (3) detections left without a marker are ignored, their number is recorded per frame
# (max_detections is no longer used: a frame is not dropped for having extra blobs). Everything else (6 of 8, area share, roundness / colour thresholds, precheck rule, verdict and interpretation) is unchanged.
# 35b: second configuration of experiment 35 (35_hand_markers.yaml stays as it is; its precheck stopped: every video had under 80 % of the frames with all 21 markers found, 2026-10-27). No f had been computed.
# New rules fixed 2026-10-27 before the new precheck (user's instructions): the 21 red ink dots (joint numbers 0-20) are all detected, but only the MCP and PIP markers (joints 5, 6, 9, 10, 13, 14, 17, 18) enter the
# estimate; a frame is kept when at least 6 of those 8 (min_markers_ratio 0.75) are found, the fixed_template cost uses the points that are found; the lower blob area is a share of the MediaPipe hand box area
# (area_min_frac = 40 px / 331,092 px^2, the mean over the two 50 cm videos IMG_7267 / IMG_7266 of the median box area of the tracked hand, so that it equals today's 40 px lower limit at 50 cm); roundness and colour
# thresholds are unchanged. Precheck: the share of kept frames in the tilt phase (from 3 s) must be at least 70 % and the front window must hold a reference frame showing all 8 used markers; every distance
# needs at least one video that passes, else the official run is not started. MediaPipe main comparison: the same 8 joints through fixed_template; 27's candidate (wrist excluded, 16 points) is reported as a record.
# 35: does the f-versus-distance slope of experiment 27 (real hand, MediaPipe, slope about -1.0) survive when the points are measured by image processing instead of a learned model? Small colour dots on the palm side
# of the real hand are found by colour / blob detection, named once by the nearest MediaPipe joints (naming only), followed with Hungarian matching and a homography check, and fed to the unchanged fixed_template analysis in
# place of the joints. MediaPipe is analysed beside it with 27's candidate settings. The checkerboard slope of the same camera was -0.02.
# Fixed 2026-10-27 before the run; nothing is changed after seeing results.
videos:                              # file, distance_cm (1x, default settings, landscape, same session)
  - {file: IMG_7267.MOV, distance_cm: 50}
  - {file: IMG_7266.MOV, distance_cm: 50}
  - {file: IMG_7265.MOV, distance_cm: 60}
  - {file: IMG_7264.MOV, distance_cm: 60}
  - {file: IMG_7263.MOV, distance_cm: 75}
  - {file: IMG_7262.MOV, distance_cm: 75}
input_dir: /home/juson/data/hand_focal_videos
ref_f_by_distance: {50: 1660.6, 60: 1653.7, 75: 1644.9}     # the checkerboard distance experiment of the same day (user-provided); the errors against 1680 are recorded as well
# The marker colour and count are what the frames show (red ink dots, 21 of them, about one on each MediaPipe landmark); the request text said green / 16, to be replaced by the user with the real values.
markers:
  color: red
  count: 21
  hue_ranges: [[0, 6], [174, 179]]   # OpenCV hue 0-179 (red wraps around 0)
  s_min: 130
  v_min: 90
  area_min: 40                       # px of a blob
  area_max: 3000
  circularity_min: 0.6               # 4 pi A / P^2
  region_margin: 0.30                # the MediaPipe hand box is enlarged by this: only the search area, never a coordinate
  used_ids: [5, 6, 9, 10, 13, 14, 17, 18]   # MCP and PIP joints: the markers named so enter the estimate; the other markers are only detected (and followed)
  area_min_frac: 1.208e-4            # lower blob area as a share of the MediaPipe hand box area (area_min is not used when this is set)
  naming_radius_frac: 0.08           # a used marker is "seen" in the reference frame when its nearest MediaPipe joint is within this x the hand box long side
  max_detections: 21                 # (35b tracker only; the reacquire tracker ignores extra blobs instead)
  min_markers_ratio: 0.75            # share of the used markers that must be matched for a frame to be kept (6 of 8)
  tracker: reacquire                 # match against the last accepted position or the homography-predicted position; homography check on the used markers only; extra blobs ignored
  move_frac: 0.03                    # a marker pair moving more than this x the hand box (x min(gap in frames, gap_cap)) is cut
  gap_cap: 5
  ransac_frac: 0.03                  # homography reference -> frame, RANSAC threshold as a share of the hand box
  min_inlier_ratio: 0.9              # a frame whose homography keeps fewer of the matched markers is dropped (swapped labels)
precheck:
  min_all_found_ratio: 0.8           # (first configuration only)
  min_tilt_valid_ratio: 0.70         # share of the tilt-phase hand frames that are kept; every distance needs a video at or above it
marker_exclusion:                    # the official run excludes a video whose kept share in the tilt phase is below this (the 27 rule of "detection failures" for the markers)
  min_tilt_valid_ratio: 0.70
session:                             # what the entries do not say: main camera, 1x, no gloves; the person is not named
  phone: main
  lens: 1x
  glove: false
  person_id:
candidate:                           # MediaPipe side: 27's settings, unchanged
  detector: mediapipe_hands
  wrist_mode: exclude
  estimator: fixed_template
  front_window: 17's (phase_mode nominal, tilt phase from 3.0 s)
exclusion:                           # same as 27
  edge_rate_max: 0.05
  detect_fail_max: 0.20
# Verdict of each method on the slope of log f against log distance of the pooled f (video-level bootstrap within each distance):
#   반비례 없음: the whole 95% interval above slope_none_min and every pooled f within f_tol of the reference f of its distance
#   반비례 있음: the whole 95% interval below slope_yes_max
#   otherwise 판단 보류; 판단 불가 when a distance has no included video
# Interpretation: markers 반비례 없음 + MediaPipe 반비례 있음 -> 원인은 검출 모델; both 반비례 있음 -> 원인은 손 자체; otherwise 해석 보류.
verdict:
  slope_none_min: -0.3
  slope_yes_max: -0.7
  f_tol: 0.10
bootstrap:
  n: 1000
  seed: 42
compare:
  results_27: runs/27_main_camera_extension/20261026T044322Z/results.json
  35c: /home/juson/project/2026-2-Capstone-T02-calib-free-hands/HandCalib/runs/35_hand_markers/20261027T045805Z/results.json
rating_v2:
  tilt_min_s: 18.0
  theta_max_min_deg: 55.0
  usable_log_std_max: 0.1
  reference_log_std_max: 0.15
guide:
  phase_segmentation:
    noise_percentile: 95
    k_d: 3.0
    theta_min_deg: 15.0
    median_window_s: 0.3
    sustain_s: 0.5
    front_search_s:
    - 0.5
    - 2.5
    d0_cap_theta_deg: 20.0
    use_motion: false
    k_v: 3.0
    motion_window_s: 0.3
    exclude_large_tilt: false
    max_tilt_deg: 45.0
  conditions:
    reference_detector: wilor_yolo
    box_short_ratio_max: 0.65
    edge_rate_max: 0.05
    transition_min_s: 2.5
    tilt_rule: frames_median
    tilt_max_deg: 45.0
    min_tilt_frames: 30
    theta_tilt_median_range_deg:
    - 20.0
    - 40.0
    axis_bins_min: 5
    finger_extension_min: 0.9

code_42: {branch: exp/42-free-shape3d-hand-videos, commit: f72a4aa, modules: [HandCalib/handfocal.py, HandCalib/run.py]}
n_workers: 16
workers: 6
output:
  root: runs/42_free_shape3d_hand
  results_yaml: results/42_free_shape3d_hand.yaml

pipeline:
