# 123: 광류 사슬 대 마커 (사용자 2026-11-11: "1번 진행해줘." - 122 뒤 제안한 "광류 사슬이 팀원 손에서 마커와 어떻게 다른지 직접 잰다"), 기록용, 판정 없음.
# 122: 마커 추적점으로는 두 사람이 같은 값(팀원 +9.7 / +10.9%, 나 +12.0 / +12.4%), 같은 영상의 광류 사슬로는 팀원 -11.1 / -10.4%, 나 +7.2 / +11.3%.
# 122 가 저장한 점(광류 사슬 점, 마커 점)만 쓴다. 기준 프레임의 마커를 사슬의 호모그래피로 옮긴 위치와 실제 마커의 거리를 프레임·관절마다 재고, 그 거리를
#   (a) 손이 평면이 아닌 부분 = 그 프레임 마커에 가장 잘 맞는 호모그래피(최소제곱)로도 남는 거리,  (b) 사슬의 평면 변환이 틀린 부분 = 사슬과 그 호모그래피의 차이
# 로 나눈다. 그리고 세 가지 점(마커 그대로 / 마커를 (a)의 호모그래피로 옮긴 것 / 마커를 사슬로 옮긴 것)으로 같은 추정(j16, 경사 11° 고정 + 함께 추정)을 돌린다.
# 읽는 법(실행 전에 정함): "가장 잘 맞는 평면 변환으로 옮긴 마커"의 f 가 마커 그대로와 비슷하면(두 사람 모두) 평면으로 누르는 것 자체는 문제가 아니고 사슬의 평면 변환이 팀원 손에서 틀린 것.
# 그 f 가 팀원에서만 사슬처럼 낮아지면 평면으로 누르는 것이 팀원 손에서 문제. 손 방향 구간은 118 과 같음. 기준 f 는 summary.md 에만.
experiment:
  name: 123_chain_vs_marker
  seed: 42
settings_config: configs/74b_multistart_rerun.yaml
joint_set: j16
code: {branch: optical_flow, commit: 013645b, modules: [HandCalib/optical_flow/experiments.py]}
ramps_deg: [11]
videos: ["__none__"]
extra_videos:
  - {file: IMG_7399.MOV, person: teammate, ref_f_px: 1672}
  - {file: IMG_7400.MOV, person: teammate, ref_f_px: 1672}
  - {file: IMG_7405.MOV, person: self, ref_f_px: 1672}
  - {file: IMG_7406.MOV, person: self, ref_f_px: 1672}
chain_vs_marker:
  points_run: runs/122_marker_track_both/20261111T092735Z
  angle_bins_deg: [-180, -60, -20, 20, 60, 180]
workers: 48
