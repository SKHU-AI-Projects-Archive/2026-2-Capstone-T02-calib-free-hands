# 130: 손가락마다 변환을 따로 구하는 사슬 (사용자 2026-11-11: "일단 1번은 돌려놓고" - 129 뒤 제안한 "손가락마다 변환을 따로 구하기"), 기록용, 판정 없음.
# 127: 특징점 영역에서 엄지를 빼면 새 폰의 사람 사이 간격이 약 20%p -> 약 10%p. 128 / 129: 넓히는 양·특징점 간격을 바꾸는 것은 마커 없는 영상에서 간격을 줄이지 못함.
# 123: 마커에 가장 잘 맞는 평면 변환은 맞는 f 를 낸다 -> 변환을 손의 어느 부분에 맞추느냐가 문제. 손 전체를 한 변환으로 묶지 않고 손가락(검지~소지)마다 그 손가락 주변 특징점으로 변환을 따로 구한다.
# 손가락 영역 = 그 손가락 관절 4개(MCP~끝)의 볼록 껍질을 손 상자의 4% 넓힌 것. 특징점이 적어 호모그래피 대신 아핀(6 자유도)과 닮음(4 자유도) 두 가지. inlier 8개 미만인 단계는 손 전체 사슬(엄지 제외)의 단계 변환으로 대신.
# 손목·엄지(추정에 쓰지 않음)는 손 전체 사슬로 옮긴다. 값(4%, 손가락당 특징점 120, 최소 inlier 8)은 결과를 보지 않고 정함. 영상 = 127 의 24개 + 마커 영상 4개(추정만; 마커는 쓰지 않음).
# 읽는 법(실행 전에 정함): 새 폰에서 팀원 중앙값과 내 중앙값의 간격이 no_thumb(약 10%p)보다 뚜렷이 줄고, 묶음 안 흩어짐이 커지지 않으면 효과가 있는 것. 기준 f 는 summary.md 에만.
