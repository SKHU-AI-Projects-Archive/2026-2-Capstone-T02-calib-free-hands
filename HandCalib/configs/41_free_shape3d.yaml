# 41: the supervisor's free_shape3d (2026-10-29, second code of the day: "call it the same way as before, with 'free_shape3d', on the same videos") run on the same six videos and the same marker tracks as experiments 39 and 40.
# Nothing of 35, 35b, 35c, 38, 39 and 40 (code, configs, runs, results) is changed. Tracks: 39's code and settings unchanged (mo_process); used markers the same eight (5, 6, 9, 10, 13, 14, 17, 18); ecfg = pipeline.estimate, as in 39 and 40.
# Call: pb, idx = free_problem(trk, (W, H), ecfg, huber_rel, ids); r = estimate_run(pb, 'free_shape3d', grid, ecfg, sigma2), where the supervisor's estimate_run is the new function s3_estimate_run (the existing estimate_run is
# not changed) and ecfg carries the free_shape3d section below under the key the supervisor's code reads (ecfg['free_template']). The supervisor's functions (_anchors3, _relief, ba3_refine, free_shape3d) are used exactly as received.
# free_shape3d = the planar free_template of 40 (same defaults, so its grid curve and f are 40's) followed by a 3-D bundle adjustment (f, one 3-D point per marker with two anchors fixed and a z prior z_rel x RMS radius, one pose
# per frame). z_rel 0.2, alt_iters 3, max_frames 120 are the supervisor's defaults. Reported per video: the 3-D f (r['f']), the planar f (r['f_planar'], expected to equal 40's f), the relative out-of-plane relief, whether the 3-D f sits on a bound.
# Verdict (fixed before the run; the 3-D bundle adjustment has no cost curve over f, so the pooled-curve rule of 39 / 40 cannot be used on it): slope of log f on log distance from the geometric mean of the per-video 3-D f of each distance,
# 95 % interval by the video-level bootstrap (videos of each distance drawn with replacement, n 1000, seed 42), then the unchanged pr_verdict thresholds (none: interval above -0.3 and every distance's f within +-10 % of the reference f;
# yes: interval below -0.7; else hold; a distance without a video, or a video whose 3-D f sits on a bound of the grid range, gives 판단 불가). With two videos per distance the bootstrap interval is coarse. The pooled-curve
# calculation of 40's verdict on the planar curves is also reported (it must reproduce 40; it is not the verdict of 41).
# The video content is a flat picture on a tablet screen, so the markers really are coplanar: the relief should be near zero, and no interpretation text of 35 applies. The reference f is the 35c value of the same camera and lens, not re-measured.
# Nothing in this file was tuned on the real videos (the dev checks were unit tests and a synthetic timing run). Code: branch exp/41-free-shape3d; code commit in code_41 below (set after the code commit, before the run).
