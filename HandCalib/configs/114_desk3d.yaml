# 114: 책상 운동 + 입체 손 모양 (사용자 2026-11-10: "진행해봐." - 본인 손에 맞춰진 두 부분, 점 종류(광류 사슬 = 평면으로 눌린 점)와 평면 손 모델을 함께 없애기), 기록용, 판정 없음.
# 점 = CoTracker3 관절별 추적점(98: 16개, 105: 새 4개, 첫 정지 구간 기준, 2 프레임마다). 추정기 = optical_flow.desk3d: 책상 자세 + 프레임별 책상 법선 둘레 회전·책상 면 미끄러짐(기존과 같음),
# 손 = 관절마다 높이를 가진 단단한 3D 모양(경사 가정 없음, 시작값만 경사 11° 평면), f. f 격자 8곳 고정 풀이 -> 이웃 해로 다시 풀기 -> 비용 낮은 3곳에서 f 까지 (dk_estimate_ms 와 같은 짜임).
# 방식: j16 높이 제약 없음 / j16 z_rel 1.0 (손 높이 ~ 손 크기 정도까지) / j21 높이 제약 없음(입체 모양이면 손목·엄지도 씀). 코드 점검(합성, 결과로 쓰지 않음)은 커밋 메시지에.
# 읽는 법(실행 전에 정함): 경사 가정 없이 본인 영상(16)과 팀원 영상(4)이 모두 대부분 ±10% 안이면 본인 손에 맞춰진 부분을 없앤 것. 팀원만 계속 낮으면 남은 원인은 손 변형 쪽. 기준 f 는 summary.md 에만.
