# 110: MCP 4개(5, 9, 13, 17)를 모두 뺀 관절 12개(손가락 마디와 끝)로 추정 (CoTracker3 추적점, 98·105 저장) (사용자 2026-11-10: "진행해줘."), 기록용, 판정 없음.
# 107·108: 중지 MCP·약지 끝만 빼서는 f 가 거의 안 바뀜(1~2%p). 사용자: "중지 MCP만 빼? 다른 MCP는?" -> 너클 줄 전체가 손가락 면에서 벗어났을 수 있어 MCP 4개를 모두 뺀다.
