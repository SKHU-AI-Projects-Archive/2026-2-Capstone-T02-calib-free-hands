# 47: the five MMPose 2-D hand models trained on COCO-WholeBody-Hand (the top five of the public benchmark under one training set) added as detectors (user request 2026-10-30).
# Environment (installed for this experiment only): /home/juson/venvs/det_mmpose_hand (torch 2.1.2+cu121, mmcv 2.1.0, mmengine 0.10.7, mmpose 1.3.2, mmdet 3.2.0 only because mmpose.apis imports it, setuptools 80.9.0 for mmengine's pkg_resources).
# Checkpoints from the MMPose model zoo metafiles (URL and SHA256 below and in /home/juson/models/mmpose_hand/sha256.txt); configs = the files of the installed mmpose 1.3.2 (SHA256 equal to GitHub v1.3.2).
# Hand boxes: hand_box_source (mediapipe | wilor_yolo) read from the existing detection caches in box_caches (never detected anew); a frame without a box is a detection failure for all five.
# Box -> model input = the config's test pipeline (GetBBoxCenterScale padding 1.25, TopdownAffine 256 x 256, flip test) through the batched wrapper (detector_worker.py mmpose_hand); TF32 off
# (with TF32 the batched result moved a heatmap maximum by one cell against inference_topdown in the dev check; with TF32 off the two agree within 1e-4 px). conf_min 0.3 for the five (as rtmpose_hand).
# Verification (report.md): official inference_topdown vs wrapper on verify.official_check_frames frames of each verify video (tol_px), point order (names and Hungarian assignment against mediapipe),
# agreement with mediapipe (% of the box), failure rates, overlays (runs folder, not committed). Stage 2 (run_stage2) only after a passed verification: gen_video (26's candidate: wrist_mode exclude,
# fixed_template; 27's exclusion and pipeline) per detector on 25's 1x, 27's G6 and 29's 0.5x videos; no verdict. Reference f (ref_f) only in summary.md. Nothing of earlier experiments is changed.
