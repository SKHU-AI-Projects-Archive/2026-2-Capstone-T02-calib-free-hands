# 66: joint combinations (user 2026-11-04: use the palm-side joints that deform less; "여러 점들의 조합으로 가장 잘 나온 걸 선택 ... 시간이 오래 걸려도 괜찮으니까 여러가지 조합도 같이 실험"),
# record only, no verdict.
# 56's points on 54's 12 videos by 65's dm_video_job unchanged (56's rules from rules_config, 65's pauses from pauses_config); 56's frames and bootstrap (30-frame blocks x 100, seed 42) for the
# mediapipe joints, 56's tracked joints main estimate only (record: they are moved by the whole-hand chain, a subset does not remove the finger motion).
# Choices made by me before the run (no result of this run seen; a 2-video dry run with 3 bootstrap samples into the scratchpad checked only that it runs - it showed that edge joints get a large
# leave-one-out miss from the geometry alone, so the leverage-divided ranking was added):
#  - per-joint departure: hf.fc_joint_loo on the mediapipe pause medians (each joint predicted by the best homography of the other 20), raw and divided by the geometric leverage (unit noise,
#    200 draws); rankings = median over the videos; combinations rank<k> / lrank<k> = the first k joints of each ranking;
#  - fixed combinations below; random ones from rng(seed) with the sizes below (the chance level of picking a combination);
#  - synthetic: 53c's scene with a rigid palm and moving fingers (hf.fc_scene), the ramp, mediapipe-like noise 0.5 %, finger angle RMS 0 / 0.5 / 1 / 2 deg (0.5-1 deg give 65's departure of the real
#    videos with the 11-deg ramp: 1.44 / 1.74 % vs real median 1.63 %), 90 / 180 deg, 20 seeds, free_template on every combination;
#  - choosing without the reference f of the video: leave one video out (smallest median |log f / ref| on the other 11), the narrowest bootstrap interval among non-boundary main estimates,
#    the median f over the combinations; the per-video oracle is reported only as an unusable upper bound;
#  - reading fixed now: the leave-one-out choice counts as better than j16 if it has more videos within 25 % and fewer on the limits (mediapipe joints, free_template); a combination looks better
#    than chance only if it beats the best random combination.
