# 56: continuous tracking (user 2026-11-02: "연속 추적을 실험해줘"). Feasibility checked first without f on IMG_7350 / 7353 / 7355 (no chain break; forward-backward loop error of the joints
# 2.2-2.7 px). 54's 12 videos at 30 fps (the pipeline's frame extraction with detect_fps 30). KLT corners inside the previous frame's hand mask (mediapipe joint hull dilated by 3 % of the box,
# the last detected joints carried over where the hand is not detected), LK forward-backward check, USAC_MAGSAC homography between neighbours, chained from the reference frame (the detected
# frame nearest the middle) forward and backward; a step with < 20 inliers breaks the chain from there on. Points of a frame = the reference frame's mediapipe 21 joints moved by the chain; frames
# used = every tracked frame whose tracked joints stay off the image border (no stillness rule; the supervisor's code keeps 120 evenly spaced). j16 main / j21 record, the supervisor's free_template
# / free_shape3d through od_job (unchanged), block bootstrap 30 frames (1 s) x 100, seed 42. Verdict: 53's rule and warnings (min 30 frames), main target j16 free_template.
# Everything else from 53 via base_config. Fixed before the run.
