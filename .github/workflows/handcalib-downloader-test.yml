name: HandCalib downloader tests

on:
  push:
    branches: [main, kjh]
  pull_request:
    branches: [main]

jobs:
  unittest:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run downloader tests
        run: python -m unittest discover -s HandCalib/tests -p "test_*.py" -v
