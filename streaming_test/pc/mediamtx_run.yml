# MediaMTX config used by run_pc.py: same as mediamtx_test.yml plus an auto-verify hook
# (written against MediaMTX v1.21.x).
# Same structure as the stock mediamtx.yml (global settings, pathDefaults, paths);
# only the keys that differ from the defaults are listed here.
# The stock mediamtx.yml is left untouched.
#
# Normally started by run_pc.py / run_pc.bat, which also overrides srtAddress, rtspAddress and the
# hook below through MTX_* environment variables using the values in run_config.yaml.
# Manual run:  mediamtx.exe mediamtx_run.yml     (from this folder, so ./recordings/ lands here)

logLevel: info

###############################################
# Global settings -> protocols
# Only SRT (publisher) and RTSP (optional monitoring with ffplay/VLC) stay on.

rtsp: true
rtspAddress: :8554
rtmp: false
hls: false
webrtc: false
moq: false

# SRT server: the phone publishes here.
srt: true
srtAddress: :8890
srtMinLatency: 120ms

###############################################
# Default path settings

pathDefaults:
  # Record every published stream. MediaMTX remuxes the incoming H.264/H.265 + AAC
  # into the file container as-is: no decoding, no re-encoding.
  record: true
  # Relative to the working directory. %path is the publish path name (e.g. "cam").
  recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f_%z
  # "mpegts" (same container as the SRT payload) or "fmp4".
  recordFormat: mpegts
  recordPartDuration: 1s
  recordSegmentDuration: 1h
  # 0s = never delete.
  recordDeleteAfter: 0s
  # Runs when a segment is finished (the phone disconnected). MediaMTX sets MTX_SEGMENT_PATH.
  # run_pc.py replaces this with the absolute python path, or with "" when auto_verify is false.
  runOnRecordSegmentComplete: 'python verify_hook.py "$MTX_SEGMENT_PATH"'

paths:
  # Any path name is accepted: srt://<pc>:8890?streamid=publish:<anything>
  all_others:
